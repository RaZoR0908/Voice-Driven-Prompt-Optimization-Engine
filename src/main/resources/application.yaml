spring:
  application:
    name: engine

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

groq:
  api-key: ${GROQ_API_KEY}
  base-url: https://api.groq.com/openai/v1
  model: llama-3.1-8b-instant
  temperature: 0.0
  whisper-model: whisper-large-v3

app:
  token:
    min-reduction-pct: 30
    confidence-threshold: 0.65

  memory:
    merge-threshold: 0.85
    related-threshold: 0.50

server:
  port: ${PORT:8080}